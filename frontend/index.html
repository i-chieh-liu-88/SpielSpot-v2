<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpielSpot — Find Playgrounds Near You</title>
    <meta name="description" content="Discover safe, fun, and age-appropriate playgrounds rated by parents in your community." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="SpielSpot — Find Playgrounds Near You" />
    <meta property="og:description" content="Discover safe, fun, and age-appropriate playgrounds rated by parents in your community." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/OG-SpielSpot.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      const savedTheme =
        localStorage.getItem('spielspot-theme') ||
        localStorage.getItem('heroui-theme') ||
        'system';
      const theme = savedTheme === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : savedTheme;
      document.documentElement.classList.add(theme);
      document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body class="grass-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
